[build]
  command = "python tools/lint_monetization.py && hugo --cleanDestinationDir --environment production --minify && python tools/audit_indexing_policy.py && npx pagefind --site public --output-path public/pagefind"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.11"
  HUGO_ENV = "production"
  HUGO_ENVIRONMENT = "production"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/**/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/posts/songdo-marine-cable-car-busan-tickets-prices/"
  to = "/posts/busan-songdo-cable-car-tickets-prices/"
  status = 301
  force = true

[[redirects]]
  from = "/posts/2026-seoul-city-tour-bus-how-to-book-routes-prices/"
  to = "/posts/seoul-city-tour-bus-how-to-book-tickets-prices/"
  status = 301
  force = true
