<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Threads OAuth Callback</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --panel: #f5f2ea;
        --ink: #151515;
        --muted: #605b54;
        --red: #b4121b;
        --line: #d8d1c4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(760px, 100%);
        padding: 34px;
        border-top: 8px solid var(--red);
        background: var(--panel);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(28px, 6vw, 48px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
      }

      label {
        display: block;
        margin: 22px 0 8px;
        font-weight: 800;
      }

      textarea,
      input {
        width: 100%;
        border: 1px solid var(--line);
        background: #fff;
        color: #111;
        font: 14px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      }

      textarea {
        min-height: 104px;
        resize: vertical;
        padding: 12px;
      }

      input {
        padding: 12px;
      }

      button {
        min-height: 44px;
        border: 0;
        margin-top: 12px;
        padding: 0 18px;
        background: #111;
        color: #fff;
        cursor: pointer;
        font-weight: 800;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .status {
        margin-top: 14px;
        color: var(--red);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Threads OAuth Callback</h1>
      <p>This page only displays the OAuth code returned by Threads. It does not send the code to a server.</p>

      <label for="code">code</label>
      <textarea id="code" readonly></textarea>
      <div class="row">
        <button id="copy-code" type="button">Copy code</button>
        <button id="copy-command" type="button">Copy exchange command</button>
      </div>

      <label for="command">PowerShell command</label>
      <input id="command" readonly />

      <div id="status" class="status"></div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code") || "";
      const error = params.get("error") || params.get("error_message") || "";
      const codeBox = document.querySelector("#code");
      const commandBox = document.querySelector("#command");
      const statusBox = document.querySelector("#status");
      const exchangeCommand = code ? `node tools/threads-oauth.mjs exchange-code "${code}"` : "";

      codeBox.value = code;
      commandBox.value = exchangeCommand;
      statusBox.textContent = code
        ? "Copy the code or exchange command and run it locally."
        : error || "No code parameter was found. Open this page from the Threads OAuth redirect URL.";

      async function copyText(value, label) {
        if (!value) return;
        await navigator.clipboard.writeText(value);
        statusBox.textContent = `${label} copied.`;
      }

      document.querySelector("#copy-code").addEventListener("click", () => copyText(code, "Code"));
      document
        .querySelector("#copy-command")
        .addEventListener("click", () => copyText(exchangeCommand, "Exchange command"));
    </script>
  </body>
</html>
